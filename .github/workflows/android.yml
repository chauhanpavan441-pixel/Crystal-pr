name: Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v6
      - name: Build CRYSTAL APKs
        run: >-
          bash gradlew :app:assembleDebug :app:assembleRelease
          --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
          "-Dorg.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8"
      - uses: actions/upload-artifact@v4
        with:
          name: crystal-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
